<div class="topbar">

<main class="wrap contact-main">
  <header class="contact-intro">
    <img src="/assets/oriphim-logo.svg?v=6" alt="Oriphim" width="42" height="30">
    <h1>Bring a hard problem.</h1>
  </header>
  <section class="contact-single" aria-labelledby="verification-title">
    <h2 id="verification-title">Apply for your first Groundwork</h2>
    <form id="contact-form" data-questions="contactQuestions">
      <div class="field-pair">
        <label for="contact-name">Name<input id="contact-name" name="name" autocomplete="name" required maxlength="120"></label>
        <label for="contact-email">Email<input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254"></label>
      </div>
      <div class="field-pair">
        <label for="contact-company">Company, lab or university<input id="contact-company" name="company" autocomplete="organization" required maxlength="160"></label>
        <label for="contact-role">You are<select id="contact-role" name="role" required>
          <option value="" disabled selected>Choose one</option>
          <option>A researcher</option>
          <option>A lab or team</option>
          <option>A startup</option>
          <option>An investor or reviewer</option>
        </select></label>
      </div>
      <label for="contact-raised" data-show-when="role=A startup" hidden>Raised so far<select id="contact-raised" name="raised" disabled>
        <option value="" selected>Choose one (optional)</option>
        <option>Nothing yet</option>
        <option>Under $1M</option>
        <option>$1M to $5M</option>
        <option>$5M to $20M</option>
        <option>More than $20M</option>
      </select></label>
      <div class="field-pair">
        <label for="contact-next">What&rsquo;s coming up<select id="contact-next" name="next">
          <option value="" disabled selected>Choose one</option>
          <option>A paper or thesis</option>
          <option>A grant application</option>
          <option>An experiment or build</option>
          <option>A raise</option>
          <option>A partner or customer pilot</option>
          <option>Something else</option>
        </select></label>
        <label for="contact-interest">Interested in<select id="contact-interest" name="interest" required>
          <option value="" disabled selected>Choose one</option>
          <option>My first Groundwork</option>
          <option>Ori in my own terminal</option>
          <option>Ongoing work</option>
          <option>Checking someone else&rsquo;s work</option>
        </select></label>
      </div>
      <label for="contact-brief">What are you working on, and what question does it rest on?<textarea id="contact-brief" name="description" required maxlength="1500" rows="3" placeholder="Your model, your notes, or the paper you're building on, and the result you need to rely on. A sentence is enough."></textarea></label>
      <div class="contact-submit"><button type="submit">Send application <span aria-hidden="true">↗</span></button><p>Opens your email, addressed to <a href="mailto:hello@oriphim.com">hello@oriphim.com</a>. One free Groundwork per person or team, 5 this quarter. I reply within two business days.</p></div>
      <p class="contact-status" role="status" aria-live="polite"></p>
    </form>
  </section>
