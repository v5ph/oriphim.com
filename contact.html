<div class="topbar">
  <div class="wrap">
    <a class="nav-home" href="/" aria-label="Oriphim home">Oriphim</a>
    
    <a href="/?auth=sign-in" class="signin-btn">Sign In</a>
  </div>
</div>
<main class="wrap contact-main">
  <header class="contact-intro">
    <img src="/assets/oriphim-logo.svg" alt="Oriphim" width="42" height="38">
    <h1>Research without barriers.</h1>
  </header>
  <div class="contact-grid">
    <section aria-labelledby="verification-title">
      <p class="contact-kicker">For institutions &amp; teams</p>
      <h2 id="verification-title">Start a verification</h2>
      <form id="verification-form">
        <div class="field-pair">
          <label for="verification-name">Name<input id="verification-name" name="name" autocomplete="name" required maxlength="120"></label>
          <label for="verification-institution">Institution<input id="verification-institution" name="institution" autocomplete="organization" required maxlength="160"></label>
        </div>
        <label for="verification-area">Research area<input id="verification-area" name="research_area" required maxlength="160" placeholder="e.g. Plasma physics"></label>
        <label for="verification-brief">What would you like to verify?<textarea id="verification-brief" name="description" required maxlength="1500" rows="3" placeholder="A paper, model, or result. A few sentences is enough."></textarea></label>
        <div class="contact-submit"><button type="submit">Book a call <span aria-hidden="true">↗</span></button><p>Choose a time on Calendly.</p></div>
        <p class="contact-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section aria-labelledby="early-access-title">
      <p class="contact-kicker">For independent explorers</p>
      <h2 id="early-access-title">Join early access</h2>
      <form id="early-access-form">
        <label for="early-access-email">Email<input id="early-access-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
        <label for="early-access-interest">Research interest<input id="early-access-interest" name="research_interest" required maxlength="160" placeholder="e.g. Complex systems"></label>
        <label for="early-access-explore">What would you want to explore?<textarea id="early-access-explore" name="exploration" required maxlength="1500" rows="3" placeholder="Tell us what you’re curious about."></textarea></label>
        <div class="contact-submit"><button type="submit">Join waitlist <span aria-hidden="true">→</span></button><p>Email me about early access and Oriphim updates.</p></div>
        <p class="contact-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </div>
</main>
