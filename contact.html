<div class="topbar">
  <div class="wrap">
    <a class="nav-home" href="/" aria-label="Oriphim home"><img src="/assets/oriphim-wordmark.svg?v=6" alt="" width="134" height="38"></a>
    
    <div class="topbar-actions"><a href="/pricing" class="nav-btn">Pricing</a><a href="/?auth=sign-in" class="signin-btn">Sign In</a></div>
  </div>
</div>
<main class="wrap contact-main">
  <header class="contact-intro">
    <img src="/assets/oriphim-logo.svg?v=6" alt="Oriphim" width="42" height="30">
    <h1>For teams whose work rests on a model.</h1>
  </header>
  <section class="contact-single" aria-labelledby="verification-title">
    <h2 id="verification-title">Tell me what you need</h2>
    <form id="contact-form" data-questions="contactQuestions">
      <div class="field-pair">
        <label for="contact-name">Name<input id="contact-name" name="name" autocomplete="name" required maxlength="120"></label>
        <label for="contact-email">Work email<input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254"></label>
      </div>
      <div class="field-pair">
        <label for="contact-company">Company<input id="contact-company" name="company" autocomplete="organization" required maxlength="160"></label>
        <label for="contact-stage">Stage<select id="contact-stage" name="stage" required>
          <option value="" disabled selected>Choose one</option>
          <option>Pre-seed</option>
          <option>Seed</option>
          <option>Series A or later</option>
          <option>Established company or lab</option>
        </select></label>
      </div>
      <div class="field-pair">
        <label for="contact-interest">Interested in<select id="contact-interest" name="interest" required>
          <option value="" disabled selected>Choose one</option>
          <option>A free Claim Check</option>
          <option>A licence quote</option>
          <option>Both</option>
        </select></label>
        <label for="contact-seats">Seats, if licensing<input id="contact-seats" name="seats" type="number" inputmode="numeric" min="1" max="10000" placeholder="e.g. 5"></label>
      </div>
      <label for="contact-brief">Which claim or model does your work rest on?<textarea id="contact-brief" name="description" required maxlength="1500" rows="3" placeholder="A paper, a model or a result, and the number you need to rely on. A sentence is enough."></textarea></label>
      <div class="contact-submit"><button type="submit">Book a call <span aria-hidden="true">↗</span></button><p>One free Claim Check per company. Licences are priced per seat, quoted within two business days.</p></div>
      <p class="contact-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
